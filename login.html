<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk – Timur Jaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Timur Jaya</h1>
    <p class="hint">Masuk untuk mengelola stok barang.</p>
    <form id="formLogin" class="dlg">
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="errLogin" role="alert"></p>
      <button type="submit" class="btn primary" id="btnLogin">Masuk</button>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
